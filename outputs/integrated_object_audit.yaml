# ============================================================================
# Integrated Object Pre-Upload Audit
# Object: all-breast-cells.h5ad
# Date: 2026-03-10
# Sequence: submission_prep (plans 1-5 complete)
# Verified: 2026-03-10 from live h5ad audit dump
# ============================================================================

object:
  filename: all-breast-cells.h5ad
  path: outputs/integrated_objects/all-breast-cells.h5ad
  size_gb: 88.9           # VERIFIED: 95,421,442,934 bytes = 88.9 GB (template had 95.4 — was wrong)
  n_cells: 2119033        # VERIFIED: matches raw dump n_obs
  n_genes: 15164          # VERIFIED: matches raw dump n_vars
  n_obs_columns: 104      # VERIFIED: 104 unique obs columns in raw dump
  n_obsm_keys: 2          # VERIFIED: X_scvi_100, X_umap
  n_layers: 0             # POST-RESTRUCTURE: layers empty; X=normalized, raw.X=counts
  schema_version: "5.3.2" # CxG schema; NOT stored in uns (validator sets it)
  is_primary_data: false
  target_build: hca

# ============================================================================
# PROVENANCE
# ============================================================================

provenance:
  build_mode: author_share  # Preferred; legacy mode uses stale CxG h5ad
  assembly_script: scripts/assemble_integrated.py
  enrichment_scripts:
    - scripts/enrich_h5ads.py          # var, obs, uns, log_normalized
    - scripts/patch_obs_h5py.py         # L1 broadcast (h5py direct)
    - scripts/patch_var_uns_h5py.py     # CxG fixes (feature_biotype rename, layer_descriptions removal)
    - scripts/patch_remove_schema_version.py  # schema_version removal from uns

  input_files:
    counts:
      file: counts_matrix.npz
      source: <author-share>/
      description: UMI count matrix (2.12M × 15,176 sparse)
    gene_data:
      file: gene_data.csv
      source: <author-share>/
      description: scVI output gene list (15,176 genes)
    annotations:
      file: ihbca_level1.5_annotations.csv
      source: <author-share>/
      description: Austin's refined cell type annotations (level0/1/1.5)
    umap:
      file: X_scVI100_UMAP.csv
      source: <author-share>/
      description: 2D UMAP from scVI 100D latent
    embeddings:
      file: X_scVI100.csv
      source: <author-share>/
      description: scVI 100D latent representation
    harmonized_donors:
      file: config/metadata_stages/L1_harmonized_donor.csv
      source: Activation/donor_metadata_alignment
      description: 287 donors × 21 clinical/demographic columns
    hancestro_mapping:
      file: mappings/hancestro_ethnicity_mapping.tsv
      source: Activation/hancestro_branch
      description: Ethnicity verbatim → HANCESTRO term ID (~500 entries)
    dataset_metadata:
      file: config/dataset_metadata.yaml
      source: Activation/dataset_metadata
      description: 7 studies × 12 tracker fields
    cl_mapping:
      file: mappings/level15_to_cl_mapping.csv
      source: Publication/hca_field_backfill
      description: 24 level1.5 labels → CL ontology terms
    gencode:
      file: mappings/gene_symbol_to_ensembl_v24.tsv
      source: GENCODE v24 GTF
      description: Gene symbol ↔ Ensembl ID + biotype + chromosome
    sra_run_tables:
      files:
        - mappings/sra_run_table_gray.csv
        - mappings/sra_run_table_kumar.csv
        - mappings/sra_run_table_murrow.csv
        - mappings/sra_run_table_nee.csv
        - mappings/sra_run_table_twigger.csv
        - mappings/sra_run_table_reed.csv
        - mappings/sra_run_table_pal.csv
      source: Publication/hca_field_backfill
      description: Per-study library_id, sequencing_run, preparation_batch
    donor_id_translations:
      files:
        - mappings/donor_id_translation_reed.csv
        - mappings/donor_id_translation_pal.csv
      source: Activation/donor_id_bridge
      description: ID mismatches between source studies and integrated object
    harmonized_donor_metadata:
      file: external_studies/harmonization/outputs/harmonized_metadata/harmonized_donor_metadata.csv
      source: Publication supplemental tables (per-study)
      description: Donor-level ethnicity mappings for HANCESTRO enrichment; consumed by assemble_integrated.py:enrich_ethnicity_from_harmonized()
    cxg_approved_genes:
      file: mappings/cxg_approved_genes.txt
      source: CxG schema 5.3.2
      description: 62,700 approved Ensembl IDs; 15,164 present in object

  pipeline_dag:
    # Full 9-stage DAG; integrated path is stages 3 → 6
    - stage: assemble_integrated
      script: run/assemble_integrated.sh
      resources: 180GB, 2hr
      output: all-breast-cells.h5ad (pre-enrichment)
    - stage: enrich_integrated
      script: run/enrich_integrated.sh
      resources: 256GB, 6hr
      output: all-breast-cells.h5ad (enriched in-place)
      depends_on: [assemble_integrated]

# ============================================================================
# X MATRIX (RAW COUNTS)
# ============================================================================

X:
  description: Log-normalized expression (post-restructure)
  shape: [2119033, 15164]
  dtype: float32           # VERIFIED
  format: sparse CSR       # VERIFIED: csr_matrix
  density: 0.121878        # Same sparsity pattern as raw counts
  nnz: 3916307723          # Same nnz as raw counts (same nonzero positions)
  origin: "Moved from layers/log_normalized via restructure_raw_x.py (2026-03-17, job 50031446)"
  computation: "log1p(normalize_total(X, target_sum=1e4))"
  audit_status: PASS
  notes: >
    POST-RESTRUCTURE (2026-03-17): X now holds log-normalized data.
    Raw counts moved to raw.X per HCA recommendation. This resolves
    HCA validator warning "STRONGLY RECOMMENDED to provide normalized data".

# ============================================================================
# LAYERS
# ============================================================================

layers:
  status: EMPTY (post-restructure)
  notes: >
    POST-RESTRUCTURE (2026-03-17): layers/log_normalized moved to /X.
    /layers group removed entirely. All expression data now in X (normalized)
    and raw.X (raw counts). This is the HCA-preferred layout.

# ============================================================================
# RAW
# ============================================================================

raw:
  exists: true  # POST-RESTRUCTURE (2026-03-17)
  X:
    description: Raw UMI counts (moved from /X)
    shape: [2119033, 15164]
    dtype: float32
    format: sparse CSR
    nnz: 3916307723
    origin: "Moved from /X via restructure_raw_x.py (2026-03-17, job 50031446)"
  var:
    description: "Copy of /var (required by anndata raw layer spec)"
    n_columns: 10  # Same columns as /var

