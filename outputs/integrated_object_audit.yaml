# ============================================================================
# KNOWN GAPS
# ============================================================================

known_gaps:
  hancestro_ethnicity:
    severity: KNOWN-ACCEPTABLE
    scope: "845,942 cells (39.9%) have 'unknown' ethnicity"  # VERIFIED from raw dump top_values
    affected_cells: 845942   # VERIFIED (template said ~241,000 — DISCREPANCY)
    studies_fully_missing: [pal, twigger, murrow]
    resolution: "Requires author outreach; not fixable from available data"
    tracker: Activation/hancestro_branch
    discrepancy_note: >
      Template said ~241,000 affected cells (11.3%). Raw dump shows 845,942
      (39.9%). The original estimate likely counted only truly-missing donors,
      not all cells with "unknown" as their ethnicity value.

  cell_type_unknown:
    severity: KNOWN-ACCEPTABLE
    scope: "19 unique CL terms (not 22); some labels mapped to 'unknown'"
    affected_studies: [kumar, murrow, nee, pal]
    resolution: >
      Doublets and single nuclei are computational artifacts, not cell types.
      "unknown" is the correct CL assignment. 19/22 level1.5 labels have
      CL terms; some labels share CL terms.

  cxg_label_columns_missing:
    severity: NEEDS-INVESTIGATION
    scope: "7 CxG label columns (cell_type_label, assay_label, etc.) not in h5ad"
    detail: >
      The template listed 7 label columns but none appear in the raw dump.
      These may be auto-generated by the CxG validator on upload, or they
      were never written. If HCA requires them pre-upload, they must be added.

  hancestro_verify_flags:
    severity: LOW
    scope: 12 rows in mapping table
    detail: >
      Ambiguous ethnicity labels with forced mappings.
      Examples: "Jewish" → European (HANCESTRO:0324 prohibited),
      "White/Mexican" → Hispanic, mixed-race with || separator.
    resolution: "Documented in hancestro_ethnicity_mapping.tsv status column"

  sparse_l1_columns:
    severity: INFORMATIONAL
    columns_below_50_pct:
      - age_at_first_birth (18.4% coverage, 81.6% null)
      - age_continuous (66.0% coverage, 34.0% null)
      - dissociation_minutes (37.9% coverage, 62.1% null)
    columns_with_categorical_unknown:
      - brca_genotype (100% non-null but includes unknown category)
      - risk_genotype_only (100% non-null but includes unknown category)
      - bmi_category (100% non-null but includes unknown category)
      - metadata_notes (100% non-null but includes placeholder values)
    resolution: "Expected sparsity — source publications did not collect these fields"
    notes: >
      Many columns that appeared sparse in the template (estimated ~30% coverage)
      actually have 100% non-null because NaN was encoded as an explicit category
      (e.g., "unknown", "not_reported"). Only float64 columns retain true NaN.

  registry_cell_count_stale:
    severity: LOW
    detail: >
      source_dataset_registry.yaml lists 2,122,065 cells; actual post-Pal-dedup
      count is 2,119,033. Registry should be updated.

  assay_term_count:
    severity: LOW
    detail: >
      Template listed 3 assay terms (EFO:0009899, EFO:0009922, EFO:0011025)
      but h5ad contains only 2 (EFO:0009899, EFO:0009922). EFO:0011025
      (10x 3' v3.1) is absent. Either no study uses v3.1, or the mapping
      was updated to collapse v3.1 into v3.

  dtype_discrepancies:
    severity: INFORMATIONAL
    detail: >
      Several obs columns stored as category instead of expected numeric dtype.
      This is a pandas behavior where mixed-type or string-encoded numeric
      columns become categorical when read back from h5ad. Affected columns:
      n_genes (expected int64, got category), percent_mito (expected float64,
      got category), n_counts (expected float64, got category), prob_spikein
      (expected float64, got category), prob_spikein_dblt (expected float64,
      got category). These were likely string-typed in the original CxG h5ad
      and preserved through assembly.

  brca_column_redundancy:
    severity: CLEANUP-CANDIDATE
    detail: >
      4 BRCA-related columns encode overlapping information:
      - BRCA_tested: Pal-only (76.2% null), Yes/Not_tested
      - brca_testing: Reed-only (62.1% null), yes/no/unknown
      - brca_status: Reed-only (62.1% null), BRCA1/BRCA2/WT/assume_WT/unknown
      - brca_genotype: Atlas-wide harmonized (0% null), BRCA1/BRCA2/RAD51C/negative/unknown
      brca_genotype is the authoritative harmonized column. The other 3 are study-specific
      originals carried forward from the CxG h5ad / source annotations.
      BRCA_tested and brca_testing encode the same concept (was donor tested?).
      brca_status and brca_genotype encode the same concept (what was the result?).
    recommendation: >
      Keep brca_genotype as the harmonized field. Consider dropping BRCA_tested,
      brca_testing, brca_status — or at minimum, document the relationship in
      obs_field_descriptions.
    flagged: 2026-03-17

  unexpected_var_columns:
    severity: INFORMATIONAL
    detail: >
      5 var columns not in original template: gene_id, symbol, highly_variable,
      means, dispersions, dispersions_norm. These are standard scVI/scanpy
      outputs carried through from assembly. Not problematic but should be
      documented.

